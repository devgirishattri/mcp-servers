version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /database/mssql-mcp
      - /database/mysql-mcp
      - /database/psql-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Updates the commit SHAs that ci.yml pins its actions to.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
